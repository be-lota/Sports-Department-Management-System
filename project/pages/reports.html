<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports | Sports Booking System</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css">

</head>

<body class="officer-side">

<header class="app-topbar">

    <div class="topbar-left">
        <button class="sidebar-toggle" id="sidebarToggle">
            <i class="fa-solid fa-bars"></i>
        </button>

        <img src="../assets/images/svg.webp" class="topbar-logo">

        <span class="topbar-title">
            Sports Booking System
        </span>
    </div>

    <div class="topbar-right">

        <button class="icon-btn" id="notifBell">
            <i class="fa-regular fa-bell"></i>
            <span class="badge-dot" id="notifCount">3</span>
        </button>

        <div class="topbar-profile">
            <img src="../assets/images/profile.jpg" class="topbar-avatar">
            <span class="topbar-username" id="topbarUsername">
                Sports Officer
            </span>
        </div>

    </div>

</header>


<div class="app-shell">

<aside class="sidebar" id="sidebar">

<nav class="sidebar-nav">

<a href="../pages/officer-dashboard.html" class="sidebar-link">
<i class="fa-solid fa-gauge"></i>
<span>Dashboard</span>
</a>

<a href="../pages/manage-facilities.html" class="sidebar-link">
<i class="fa-solid fa-building"></i>
<span>Manage Facilities</span>
</a>

<a href="../pages/equipment-inventory.html" class="sidebar-link">
<i class="fa-solid fa-basketball"></i>
<span>Equipment Inventory</span>
</a>

<a href="../pages/booking-requests.html" class="sidebar-link">
<i class="fa-solid fa-calendar-check"></i>
<span>Facility Requests</span>
</a>

<a href="../pages/loan-requests.html" class="sidebar-link">
<i class="fa-solid fa-handshake"></i>
<span>Equipment Loans</span>
</a>

<a href="../pages/officer-notifications.html" class="sidebar-link ">
<i class="fa-solid fa-bell"></i>
<span>Notifications</span>
</a>

<a href="../pages/complaints.html" class="sidebar-link">
<i class="fa-solid fa-circle-exclamation"></i>
<span>Complaints</span>
</a>

<a href="../pages/reports.html" class="sidebar-link active">
<i class="fa-solid fa-chart-column"></i>
<span>Reports</span>
</a>

<a href="../pages/login.html" class="sidebar-link sidebar-link--logout">
<i class="fa-solid fa-right-from-bracket"></i>
<span>Logout</span>
</a>

</nav>

</aside>



<main class="app-main">

<div class="page-heading">
<h1>Reports</h1>
<p>View system statistics and generate reports.</p>
</div>


<section class="stats-grid">

<div class="stat-card">
<div class="stat-icon stat-icon--blue">
<i class="fa-solid fa-calendar-check"></i>
</div>

<div>
<span class="stat-number" id="reportTotalBookings">0</span>
<span class="stat-label">Facility Bookings</span>
</div>
</div>


<div class="stat-card">
<div class="stat-icon stat-icon--green">
<i class="fa-solid fa-basketball"></i>
</div>

<div>
<span class="stat-number" id="reportTotalLoans">0</span>
<span class="stat-label">Equipment Loans</span>
</div>
</div>


<div class="stat-card">
<div class="stat-icon stat-icon--amber">
<i class="fa-solid fa-building"></i>
</div>

<div>
<span class="stat-number" id="reportTotalFacilities">0</span>
<span class="stat-label">Facilities</span>
</div>
</div>


<div class="stat-card">
<div class="stat-icon stat-icon--red">
<i class="fa-solid fa-circle-exclamation"></i>
</div>

<div>
<span class="stat-number" id="reportTotalComplaints">0</span>
<span class="stat-label">Complaints</span>
</div>
</div>

</section>



<section class="table-card">

<div class="table-card-head">
<h2>Generate Reports</h2>
</div>

<div class="report-actions">

<select id="reportTypeSelect">
<option value="bookings">Bookings</option>
<option value="equipment">Equipment Loans</option>
<option value="users">Users</option>
</select>

<input type="date" id="reportFrom">
<input type="date" id="reportTo">

<button class="btn btn--primary" id="generateReportBtn">
<i class="fa-solid fa-file-circle-plus"></i>
Generate Report
</button>

<button class="btn btn--outline" id="exportPdfBtn">
<i class="fa-solid fa-file-pdf"></i>
Export PDF
</button>

<button class="btn btn--outline" id="exportExcelBtn">
<i class="fa-solid fa-file-excel"></i>
Export Excel
</button>

</div>

<div class="table-scroll">
<table class="data-table">
<thead id="reportResultsHead"></thead>
<tbody id="reportResultsBody"></tbody>
</table>
</div>

</section>

</main>

</div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/script.js"></script>
<script src="../assets/js/officer.js"></script>
<script src="../assets/js/auth.js"></script>

</body>
</html>
