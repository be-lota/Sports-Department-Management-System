            <span class="topbar-username" id="topbarUsername">
                Sports Officer
            </span>
        </div>

    </div>
</header>

<div class="app-shell">

<aside class="sidebar" id="sidebar">

<nav class="sidebar-nav">

<i class="fa-solid fa-triangle-exclamation"></i>
<span>Complaints</span>

<main class="app-main">

<div class="page-heading">
<h1>Manage Facilities</h1>
<p>Add, edit and manage all sports facilities.</p>
</div>

<section class="toolbar-card">

<div class="search-box">
<i class="fa-solid fa-magnifying-glass"></i>
<input
type="text"
placeholder="Search facility...">
</div>

<button class="btn btn--primary" data-open-modal="facilityModal">
<i class="fa-solid fa-plus"></i>
Add Facility
</button>

</section>

<section class="table-card">

<div class="table-card-head">
<h2>Facilities</h2>
</div>

<div class="table-scroll">

<table class="data-table">

<thead>

<tr>

<th>Facility</th>
<th>Capacity</th>
<th>Status</th>
<th>Actions</th>

</tr>

</thead>

<tbody id="facilitiesBody">
</tbody>

</table>

</div>

</section>

</main>

</div>

<!-- Add/Edit Facility Modal -->

<div class="modal-overlay" id="facilityModal">

<div class="modal-box">

<div class="modal-head">

<h3>Add Facility</h3>

<button
class="modal-close"
data-close-modal="facilityModal">

&times;

</button>

</div>

<form class="modal-form" id="facilityForm">

<label>

Facility Name

<input
type="text"
id="facilityName"
placeholder="Football Pitch"
required>

</label>

<label>

Category

<select id="facilityCategory" required>
<option value="football">Football</option>
<option value="basketball">Basketball</option>
<option value="tennis">Tennis</option>
<option value="volleyball">Volleyball</option>
<option value="rugby">Rugby</option>
<option value="gym">Gym</option>
</select>

</label>

<label>

Capacity

<input
type="number"
id="facilityCapacity"
placeholder="50"
required>

</label>

<label>

Status

<select id="facilityStatus">

<option value="1">Available</option>
<option value="0">Closed</option>

</select>

</label>

<label>

Description

<textarea
rows="4"
id="facilityDescription"
placeholder="Facility description"></textarea>

</label>

<p id="facilityError" class="form-error"></p>

<div class="modal-actions">

<button
type="button"
class="btn btn--ghost"
data-close-modal="facilityModal">

Cancel

</button>

<button
type="submit"
class="btn btn--primary">

Save Facility

</button>

</div>

</form>

</div>

</div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/script.js"></script>
<script src="../assets/js/officer.js"></script>
<script src="../assets/js/auth.js"></script>

</body>
</html>
