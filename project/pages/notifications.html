<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications | Sports Booking System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="student-side">

<header class="app-topbar">
  <div class="topbar-left">
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu">
      <i class="fa-solid fa-bars"></i>
    </button>
    <img src="../assets/images/svg.webp" alt="System Logo" class="topbar-logo">
    <span class="topbar-title">Sports Booking System</span>
  </div>
  <div class="topbar-right">
    <button class="icon-btn" id="notifBell" aria-label="Notifications">
      <i class="fa-regular fa-bell"></i>
      <span class="badge-dot" id="notifCount">0</span>
    </button>
    <div class="topbar-profile">
      <img src="../assets/images/profile.jpg" alt="Profile" class="topbar-avatar">
      <span class="topbar-username" id="topbarUsername"></span>
    </div>
  </div>
</header>

<div class="app-shell">

  <aside class="sidebar" id="sidebar">
    <nav class="sidebar-nav">
      <a href="../pages/Studentdashboard.html" class="sidebar-link"><i class="fa-solid fa-gauge"></i><span>Dashboard</span></a>
      <a href="../pages/facilities.html" class="sidebar-link"><i class="fa-solid fa-building-columns"></i><span>Book Facility</span></a>
      <a href="../pages/equipment.html" class="sidebar-link"><i class="fa-solid fa-basketball"></i><span>Equipment</span></a>
      <a href="../pages/notifications.html" class="sidebar-link active"><i class="fa-solid fa-bell"></i><span>Notifications</span></a>
      <a href="../pages/profile.html" class="sidebar-link"><i class="fa-solid fa-user"></i><span>Profile</span></a>
      <a href="../pages/login.html" class="sidebar-link sidebar-link--logout"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
    </nav>
  </aside>

  <main class="app-main">

    <div class="page-heading">
      <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
        <div>
          <h1>Notifications</h1>
          <p>Stay updated with your bookings and equipment requests.</p>
        </div>
        <button class="btn btn--outline" id="markAllReadBtn">Mark All as Read</button>
      </div>
    </div>

    <section class="toolbar-card">
      <div class="filter-chips" id="notificationFilters">
        <button class="chip chip--active" data-filter="all">All</button>
        <button class="chip" data-filter="booking">Bookings</button>
        <button class="chip" data-filter="loan">Equipment</button>
        <button class="chip" data-filter="system">System</button>
      </div>
    </section>

    <section class="notifications-container">
      <div id="notificationsListContainer"></div>

      <div class="empty-state" id="emptyState" style="display: none;">
        <div class="empty-state-icon">
          <i class="fa-solid fa-bell-slash"></i>
        </div>
        <h3>No Notifications</h3>
        <p>You're all caught up! Check back later for updates.</p>
      </div>
    </section>

    <section class="pagination-section" id="paginationSection" style="display: none;">
      <div class="pagination">
        <button class="btn btn--outline btn--sm" id="prevBtn">← Previous</button>
        <span class="pagination-info"><span id="currentPage">1</span> of <span id="totalPages">1</span></span>
        <button class="btn btn--outline btn--sm" id="nextBtn">Next →</button>
      </div>
    </section>

  </main>
</div>

<style>
</style>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/script.js"></script>
<script src="../assets/js/auth.js"></script>
<script>
//  SPECIFIC JAVASCRIPT

function handleMarkAsRead(btn) {
  const notificationItem = btn.closest('.notification-item');
  if (!notificationItem) return;

  notificationItem.classList.remove('notification-item--unread');
  notificationItem.classList.add('notification-item--read');
  btn.style.display = 'none';

  const notificationId = notificationItem.dataset.id;
  if (notificationId) {
    apiClient.markNotificationAsRead(notificationId).catch(err => {
      console.error('Failed to mark notification as read:', err);
    });
  }
}

function handleViewBooking(btn) {
  window.location.href = 'facilities.html';
}

function handleViewEquipment(btn) {
  window.location.href = 'equipment.html';
}

function setupNotificationFilters() {
  const filterChips = document.querySelectorAll('#notificationFilters .chip');
  
  filterChips.forEach(chip => {
    chip.addEventListener('click', () => {
      // Update active chip
      filterChips.forEach(c => c.classList.remove('chip--active'));
      chip.classList.add('chip--active');
      
      const filter = chip.dataset.filter;
      filterNotifications(filter);
    });
  });
}

function filterNotifications(filter) {
  const notifications = document.querySelectorAll('.notification-item');
  let visibleCount = 0;
  
  notifications.forEach(notification => {
    if (filter === 'all' || notification.dataset.type === filter) {
      notification.style.display = 'flex';
      visibleCount++;
    } else {
      notification.style.display = 'none';
    }
  });
  
  const emptyState = document.getElementById('emptyState');
  if (visibleCount === 0) {
    emptyState.style.display = 'block';
  } else {
    emptyState.style.display = 'none';
  }
}

async function markAllAsRead() {
  try {
    await apiClient.markAllNotificationsAsRead();

    document.querySelectorAll('.notification-item--unread').forEach(item => {
      item.classList.remove('notification-item--unread');
      item.classList.add('notification-item--read');
      const dismissBtn = item.querySelector('[onclick*="handleMarkAsRead"]');
      if (dismissBtn) dismissBtn.style.display = 'none';
    });

    const badge = document.getElementById('notifCount');
    if (badge) badge.textContent = '0';
  } catch (error) {
    console.error('Failed to mark all notifications as read:', error);
  }
}

async function loadNotifications() {
  try {
    const notifications = await apiClient.getNotifications();
    const container = document.getElementById('notificationsListContainer');
    const emptyState = document.getElementById('emptyState');

    if (notifications.length === 0) {
      container.innerHTML = '';
      emptyState.style.display = 'block';
      return;
    }

    const html = notifications.map(notif => `
      <div class="notification-item notification-item--${notif.is_read ? 'read' : 'unread'}" data-type="${notif.type}" data-id="${notif.id}">
        <div class="notification-icon notification-icon--${notif.type}">
          <i class="fa-solid fa-${getNotificationIcon(notif.type)}"></i>
        </div>
        <div class="notification-content">
          <div class="notification-header">
            <h3>${notificationTypeLabel(notif.type)}</h3>
            <span class="notification-time">${formatTime(notif.created_at)}</span>
          </div>
          <p class="notification-message">${notif.message}</p>
          ${!notif.is_read ? `<div class="notification-actions">
            <button class="btn btn--ghost btn--sm" onclick="handleMarkAsRead(this)">Dismiss</button>
          </div>` : ''}
        </div>
      </div>
    `).join('');

    container.innerHTML = html;
    emptyState.style.display = 'none';

    const unreadCount = notifications.filter(n => !n.is_read).length;
    document.getElementById('notifCount').textContent = unreadCount || '';
  } catch (error) {
    console.error('Failed to load notifications:', error);
  }
}

function notificationTypeLabel(type) {
  const labels = { booking: 'Booking', loan: 'Equipment', system: 'System' };
  return labels[type] || 'Notification';
}

function getNotificationIcon(type) {
  const iconMap = {
    booking: 'calendar-check',
    loan: 'basketball',
    system: 'triangle-exclamation',
  };
  return iconMap[type] || 'bell';
}

function formatTime(timestamp) {
  const date = new Date(timestamp);
  const now = new Date();
  const seconds = Math.floor((now - date) / 1000);
  
  let interval = seconds / 31536000;
  if (interval > 1) return Math.floor(interval) + ' years ago';
  
  interval = seconds / 2592000;
  if (interval > 1) return Math.floor(interval) + ' months ago';
  
  interval = seconds / 86400;
  if (interval > 1) return Math.floor(interval) + ' days ago';
  
  interval = seconds / 3600;
  if (interval > 1) return Math.floor(interval) + ' hours ago';
  
  interval = seconds / 60;
  if (interval > 1) return Math.floor(interval) + ' minutes ago';
  
  return 'just now';
}

document.addEventListener('DOMContentLoaded', () => {

  setupNotificationFilters();
  
  const markAllBtn = document.getElementById('markAllReadBtn');
  if (markAllBtn) {
    markAllBtn.addEventListener('click', markAllAsRead);
  }
  
  loadNotifications();
});
</script>

</body>
</html>
